<main
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-base-100 px-6 py-16 text-center text-base-content"
>
  <div
    class="pointer-events-none absolute inset-0 bg-gradient-to-b from-base-200/90 via-base-100 to-base-100"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute -left-24 top-16 h-72 w-72 rounded-full bg-secondary/20 blur-3xl"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute -right-16 bottom-10 h-80 w-80 rounded-full bg-neutral/15 blur-3xl"
    aria-hidden="true"
  ></div>

  <div class="relative z-10 w-full max-w-[42rem]">
    <div class="mb-6 flex items-center justify-end gap-2">
      <sv-lang-switch />
      <sv-theme-toggle />
    </div>
    <p
      class="mb-8 flex items-center justify-center gap-3 sm:gap-4"
      aria-label="SilverVibe"
    >
      <img
        [ngSrc]="markSrc()"
        alt=""
        width="96"
        height="96"
        priority
        class="h-[4.5rem] w-[4.5rem] sm:h-20 sm:w-20"
      />
      <span class="inline-flex items-start gap-0.5">
        <span
          class="text-[clamp(2.5rem,7vw,3.5rem)] font-bold leading-none tracking-[-0.045em]"
        >
          <span class="text-neutral">Silver</span
          ><span class="text-secondary">Vibe</span>
        </span>
        <span
          class="mt-1 text-sm font-semibold leading-none text-neutral sm:mt-1.5 sm:text-base"
          aria-hidden="true"
          >™</span
        >
      </span>
    </p>

    <p
      class="mb-6 inline-block border border-base-300 bg-base-200/80 px-3.5 py-1.5 text-[13px] font-semibold text-base-content/70 backdrop-blur-sm"
    >
      {{ 'landing.badge' | transloco }}
    </p>

    <h1
      class="m-0 mb-5 text-[clamp(2.375rem,7vw,4rem)] font-bold leading-[1.05] tracking-[-0.045em] text-base-content"
    >
      {{ 'landing.headline' | transloco }}
    </h1>

    <p
      class="mx-auto m-0 max-w-[36.875rem] text-xl leading-relaxed text-base-content/70"
    >
      {{ 'landing.body' | transloco }}
    </p>

    <footer class="mt-10 text-[13px] leading-relaxed text-base-content/55">
      <p class="m-0">{{ 'landing.footer.legal' | transloco }}</p>
      <p class="mt-3 m-0">
        <a
          class="text-base-content/70 underline decoration-base-300 underline-offset-4 transition-colors hover:text-base-content"
          href="https://github.com/silvervibe-io/silvervibe"
          rel="noopener noreferrer"
          target="_blank"
          >{{ 'landing.footer.github' | transloco }}</a
        >
        <span class="mx-2 text-base-content/30" aria-hidden="true">·</span>
        <a
          class="text-base-content/70 underline decoration-base-300 underline-offset-4 transition-colors hover:text-base-content"
          routerLink="/privacy"
          >{{ 'landing.footer.privacy' | transloco }}</a
        >
        <span class="mx-2 text-base-content/30" aria-hidden="true">·</span>
        <a
          class="text-base-content/70 underline decoration-base-300 underline-offset-4 transition-colors hover:text-base-content"
          href="mailto:info@silvervibe.io"
          >info&#64;silvervibe.io</a
        >
      </p>
    </footer>
  </div>
</main>
