<header class="space-y-1">
  <h2 class="text-xl font-semibold tracking-tight">{{ title() }}</h2>
  @if (purpose(); as purposeText) {
  <p class="text-sm text-base-content/70">{{ purposeText }}</p>
  } @if (learnMore(); as more) {
  <div class="pt-1">
    <button
      type="button"
      class="btn btn-ghost btn-xs px-0 text-base-content/60"
      [attr.aria-expanded]="learnOpen()"
      (click)="toggleLearnMore()"
    >
      {{ learnMoreLabel() }}
    </button>
    @if (learnOpen()) {
    <p class="mt-2 max-w-prose text-sm text-base-content/60">{{ more }}</p>
    }
  </div>
  }
</header>

<div class="space-y-4">
  <ng-content />
</div>

@if (dirty()) {
<div
  class="sticky bottom-2 z-10 flex flex-wrap items-center justify-end gap-2 rounded-lg border border-base-300 bg-base-100/95 p-3 shadow-sm backdrop-blur"
>
  <button
    type="button"
    class="btn btn-primary btn-sm"
    [disabled]="saving() || saveDisabled()"
    (click)="onSave()"
  >
    @if (saving()) {
    <span class="loading loading-spinner loading-xs" aria-hidden="true"></span>
    } {{ saveLabel() }}
  </button>
</div>
}
