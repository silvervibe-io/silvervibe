<label
  class="swap swap-rotate btn btn-ghost btn-sm btn-circle"
  [attr.aria-label]="
    isDark()
      ? ('shell.theme.toLight' | transloco)
      : ('shell.theme.toDark' | transloco)
  "
>
  <input type="checkbox" [checked]="isDark()" (change)="onToggle($event)" />

  <!-- sun icon (visible when dark / checked) -->
  <sv-icon name="sun" class="swap-on h-5 w-5" />

  <!-- moon icon (visible when light / unchecked) -->
  <sv-icon name="moon" class="swap-off h-5 w-5" />
</label>
