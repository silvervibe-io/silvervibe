<div
  class="space-y-3 rounded-lg border border-dashed border-base-300 bg-base-200/40 px-4 py-6"
>
  <div class="max-w-prose space-y-1">
    <h3 class="text-lg font-semibold tracking-tight">{{ title() }}</h3>
    @if (body(); as text) {
    <p class="text-sm text-base-content/70">{{ text }}</p>
    }
  </div>
  @if (primaryLabel() || secondaryLabel()) {
  <div class="flex flex-wrap gap-2">
    @if (primaryLabel(); as primary) {
    <button
      type="button"
      class="btn btn-primary btn-sm"
      (click)="primaryClick.emit()"
    >
      {{ primary }}
    </button>
    } @if (secondaryLabel(); as secondary) {
    <button
      type="button"
      class="btn btn-ghost btn-sm"
      (click)="secondaryClick.emit()"
    >
      {{ secondary }}
    </button>
    }
  </div>
  }
  <ng-content />
</div>
