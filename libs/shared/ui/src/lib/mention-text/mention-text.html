<div class="space-y-2">
  @for (block of blocks(); track $index) { @if (block.kind === 'heading') { @if
  (block.level === 2) {
  <h3 class="text-lg font-semibold">
    <sv-summary-inlines [parts]="block.inlines" />
  </h3>
  } @else {
  <h4 class="font-semibold">
    <sv-summary-inlines [parts]="block.inlines" />
  </h4>
  } } @else if (block.kind === 'list') {
  <ul class="list-disc space-y-1 pl-5">
    @for (item of block.items; track $index) {
    <li><sv-summary-inlines [parts]="item" /></li>
    }
  </ul>
  } @else {
  <p><sv-summary-inlines [parts]="block.inlines" /></p>
  } }
</div>
