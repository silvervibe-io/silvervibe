<div class="navbar border-b border-base-300 bg-base-200">
  <div class="navbar-start">
    <a class="btn btn-ghost text-xl font-semibold tracking-tight" routerLink="/"
      >{{ title() }}</a
    >
  </div>
  <div class="navbar-end gap-2 sm:gap-4">
    @for (link of links(); track link.href) { @if (link.external) {
    <a class="link link-hover text-sm" [href]="link.href">{{ link.label }}</a>
    } @else {
    <a class="link link-hover text-sm" [routerLink]="link.href"
      >{{ link.label }}</a
    >
    } } @if (showLangSwitch()) {
    <sv-lang-switch />
    } @if (showThemeToggle()) {
    <sv-theme-toggle />
    }
  </div>
</div>
<main class="mx-auto max-w-5xl p-6">
  <ng-content />
</main>
