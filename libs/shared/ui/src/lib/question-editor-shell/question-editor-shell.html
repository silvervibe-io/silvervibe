<header class="space-y-1">
  <h3 class="text-lg font-semibold tracking-tight">{{ title() }}</h3>
  @if (purpose(); as purposeText) {
  <p class="text-sm text-base-content/70">{{ purposeText }}</p>
  }
</header>

@if (tip(); as tipText) {
<sv-callout variant="tip" [title]="tipTitle()" [body]="tipText" />
}

<ul class="space-y-3">
  <ng-content />
</ul>

<div class="flex flex-wrap gap-2">
  <ng-content select="[actions]" />
</div>
