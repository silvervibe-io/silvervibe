[project]
name = "silvervibe-ai"
version = "0.0.1"
description = "LangGraph service for Silvervibe"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "langgraph>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
