<sv-shell title="Vibe Standup" [links]="links()">
  <div class="hero rounded-box bg-base-200">
    <div class="hero-content">
      <div>
        <h1 class="text-4xl font-bold">{{ 'standup.title' | transloco }}</h1>
        <p class="py-4">{{ 'standup.subtitle' | transloco }}</p>
      </div>
    </div>
  </div>
  <form class="mt-6 grid gap-4" (submit)="save($event)">
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        {{ 'standup.yesterday' | transloco }}
      </legend>
      <textarea class="textarea" [formField]="draftForm.yesterday"></textarea>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">{{ 'standup.today' | transloco }}</legend>
      <textarea class="textarea" [formField]="draftForm.today"></textarea>
    </fieldset>
    <fieldset class="fieldset">
      <legend class="fieldset-legend">
        {{ 'standup.blockers' | transloco }}
      </legend>
      <textarea class="textarea" [formField]="draftForm.blockers"></textarea>
    </fieldset>
    <button class="btn" type="submit">{{ 'standup.save' | transloco }}</button>
    @if (saved().today) {
    <p>{{ 'standup.saved' | transloco }}</p>
    }
  </form>
</sv-shell>
